<article class="product-card">
  <a href="{{ product.get_absolute_url }}" class="product-thumb">
    {% if product.image %}
      <img src="{{ product.image.url }}" alt="{{ product.name }}">
    {% else %}
      <span aria-hidden="true">{{ product.category.icon }}</span>
    {% endif %}
  </a>
  <div class="product-card-body">
    <span class="cat-label">{{ product.category.name }}</span>
    <h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    <p class="desc">{{ product.description|truncatewords:14 }}</p>
    <div class="price-row">
      <span class="price-stamp">${{ product.price }} <small>AUD</small></span>
      {% if product.in_stock %}
        <span class="stock-tag in">In stock</span>
      {% else %}
        <span class="stock-tag out">Sold out</span>
      {% endif %}
    </div>
  </div>
</article>
